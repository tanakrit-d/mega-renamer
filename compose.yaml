services:
  renamer:
    build: .
    platform: linux/amd64
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN in .env}
      MEGA_DESTINATION: /Imports
    volumes:
      - mega-session:/home/app
      - jobs:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  mega-session:
  jobs:
