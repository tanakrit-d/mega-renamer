name: Poll MEGAcmd and publish image

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if this MEGAcmd version has already been published
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: megacmd-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Read latest official MEGAcmd package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 \
            --max-time 120 \
            https://mega.nz/linux/repo/Debian_12/amd64/Packages \
            -o "$RUNNER_TEMP/megacmd-packages"
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          latest = None
          for stanza in Path(os.environ['RUNNER_TEMP'], 'megacmd-packages').read_text().split('\n\n'):
              fields = dict(line.split(': ', 1) for line in stanza.splitlines()
                            if ': ' in line and not line.startswith((' ', '\t')))
              if fields.get('Package') != 'megacmd' or fields.get('Architecture') != 'amd64':
                  continue
              version = fields.get('Version', '')
              if not re.fullmatch(r'[0-9][A-Za-z0-9.+~\-]*', version):
                  raise SystemExit(f'Unsupported MEGAcmd version: {version!r}')
              if latest is None or subprocess.run(
                  ['dpkg', '--compare-versions', version, 'gt', latest['Version']], check=False
              ).returncode == 0:
                  latest = fields
          if latest is None:
              raise SystemExit('No amd64 MEGAcmd package found in official repository')
          version = latest['Version']
          checksum = latest.get('SHA256', '')
          if not re.fullmatch(r'[a-fA-F0-9]{64}', checksum):
              raise SystemExit('Missing or invalid package SHA256')
          if Path(latest.get('Filename', '')).name != f'megacmd_{version}_amd64.deb':
              raise SystemExit('Repository package filename does not match Dockerfile URL')
          # Debian versions may contain characters that Docker tags do not support.
          tag = 'megacmd-' + re.sub(r'[^A-Za-z0-9_.-]', '_', version)
          image = 'ghcr.io/' + os.environ['GITHUB_REPOSITORY'].lower()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nsha256={checksum}\ntag={tag}\nimage={image}\n')
          print(f'Latest MEGAcmd: {version}; image: {image}:{tag}')
          PY

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check whether this version is already published
        id: check
        env:
          IMAGE: ${{ steps.package.outputs.image }}
          TAG: ${{ steps.package.outputs.tag }}
          FORCE: ${{ inputs.force || false }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$FORCE" = true ]; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "$IMAGE:$TAG" > /dev/null 2> "$RUNNER_TEMP/manifest-error"; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
            echo "Already published: $IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"
          elif grep -Eqi 'manifest unknown|no such manifest|name unknown' "$RUNNER_TEMP/manifest-error"; then
            echo 'build=true' >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/manifest-error" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        if: steps.check.outputs.build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Build and publish
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: true
          tags: |
            ${{ steps.package.outputs.image }}:latest
            ${{ steps.package.outputs.image }}:${{ steps.package.outputs.tag }}
          build-args: |
            MEGACMD_VERSION=${{ steps.package.outputs.version }}
            MEGACMD_SHA256=${{ steps.package.outputs.sha256 }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.package.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
